name: Update expressive profile

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - .profile/render.mjs
      - .profile/icons.json
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: expressive-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render profile
        run: node .profile/render.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets .profile/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update profile cards"
            git push
          fi
